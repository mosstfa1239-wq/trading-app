<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

.card{
  background:#222;
  padding:20px;
  margin:20px;
  border-radius:15px;
}

input{
  width:90%;
  padding:12px;
  margin:10px;
  border:none;
  border-radius:10px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#ff3d77;
  color:white;
  font-weight:bold;
}

</style>

</head>
<body>

<div class="card">

<h1>⚙️ Admin Panel</h1>

<input
id="taskTitle"
placeholder="Task Title">

<input
id="taskPrice"
placeholder="Task Price">

<input
id="taskProfit"
placeholder="Task Profit">

<button onclick="addTask()">
Add Task
</button>

</div>

<div class="card">

<input
id="userEmail"
placeholder="User Email">

<input
id="userBalance"
placeholder="Balance">

<button onclick="addBalance()">
Add Balance
</button>

</div>

<script>

async function addTask(){

  const res = await fetch(
    "/admin/add-task",
  {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      title:
      document.getElementById(
      "taskTitle").value,

      price:
      document.getElementById(
      "taskPrice").value,

      profit:
      document.getElementById(
      "taskProfit").value

    })
  });

  const data = await res.json();

  alert(data.msg || data.error);
}

async function addBalance(){

  const res = await fetch(
    "/admin/add-balance",
  {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      email:
      document.getElementById(
      "userEmail").value,

      balance:
      document.getElementById(
      "userBalance").value

    })
  });

  const data = await res.json();

  alert(data.msg || data.error);
}

</script>

</body>
</html>
