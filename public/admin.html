<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>

<style>

body{
  background:#111;
  color:white;
  font-family:Arial;
  text-align:center;
}

.card{
  background:#222;
  padding:20px;
  margin:20px;
  border-radius:15px;
}

input{
  width:90%;
  padding:12px;
  margin:10px;
  border:none;
  border-radius:10px;
}

button{
  padding:12px 20px;
  border:none;
  border-radius:10px;
  background:#ff3d77;
  color:white;
  font-weight:bold;
}

</style>

</head>
<body>

<div class="card">

<h1>⚙️ Admin Panel</h1>

<input
id="taskTitle"
placeholder="Task Title">

<input
id="taskPrice"
placeholder="Task Price">

<input
id="taskProfit"
placeholder="Task Profit">

<button onclick="addTask()">
Add Task
</button>

</div>

<div class="card">

<input
id="userEmail"
placeholder="User Email">

<input
id="userBalance"
placeholder="Balance">

<button onclick="addBalance()">
Add Balance
</button>

</div>



<script>

async function addTask(){

  const res = await fetch(
    "/admin/add-task",
  {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      title:
      document.getElementById(
      "taskTitle").value,

      price:
      document.getElementById(
      "taskPrice").value,

      profit:
      document.getElementById(
      "taskProfit").value

    })
  });

  const data = await res.json();

  alert(data.msg || data.error);
}

async function addBalance(){

  const res = await fetch(
    "/admin/add-balance",
  {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      email:
      document.getElementById(
      "userEmail").value,

      balance:
      document.getElementById(
      "userBalance").value

    })
  });

  const data = await res.json();

  alert(data.msg || data.error);

  location.reload();
}
</script>


<div class="card">

<h2>💬 Support Message</h2>

<input
id="supportEmail"
placeholder="User Email">

<input
id="supportMsg"
placeholder="Message">

<button onclick="sendMessage()">
Send Message
</button>

</div>

<div class="card">

<h2>📨 User Messages</h2>

<button onclick="loadMessages()">

Load Messages

</button>

<div id="messagesBox"></div>

</div>

<div class="card">

<h2>🔓 Reset Wallet</h2>

<input
id="resetWalletEmail"
placeholder="User Email">

<button onclick="resetWallet()">

Reset Wallet

</button>

</div>

<script>
async function sendMessage(){

  const res = await fetch(
    "/admin/send-message",
  {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      email:
      document.getElementById(
      "supportEmail").value,

      message:
      document.getElementById(
      "supportMsg").value

    })
  });

  const data = await res.json();

  alert(data.msg || data.error);
}

async function resetWallet(){

  const res = await fetch(
    "/admin/reset-wallet",
  {

    method:"POST",

    headers:{
      "Content-Type":"application/json"
    },

    body:JSON.stringify({

      email:
      document.getElementById(
      "resetWalletEmail").value

    })
  });

  const data = await res.json();

  alert(data.msg || data.error);
}

</script>
<script>

async function loadMessages(){

  const res =
  await fetch("/admin/messages");

  const users =
  await res.json();

  let html = "";

  users.forEach(u => {

    html += `

    <div style="
      background:#333;
      padding:10px;
      margin:10px;
      border-radius:10px;
    ">

    <h3>${u.email}</h3>

    <p>
    ${u.userMessage || ""}
    </p>

    </div>
    `;
  });

  document.getElementById(
    "messagesBox"
  ).innerHTML = html;
}

</script>

</body>
</html>
